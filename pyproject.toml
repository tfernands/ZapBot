[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zapapi"
version = "0.1.0"
description = "WhatsApp Web API over Playwright with a persistent Chromium session."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright",
]

[project.scripts]
whats-mcp = "zapapi.mcp.server:main"

[project.optional-dependencies]
notebook = [
    "ipykernel",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["zapapi*"]
